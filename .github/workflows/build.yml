name: Build RootHide tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - Makefile
      - control
      - core/**
      - Prefs/**
      - layout/**
      - RadromRingProbe.plist
      - Probe.m
      - tests/**
      - tools/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      THEOS: /tmp/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up RootHide Theos
        run: |
          brew install ldid
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"

      - name: Check probe script syntax
        run: node --check tools/probe-call-ringtone.js

      - name: Test tone selection policy
        run: |
          clang -std=c11 -Wall -Wextra -Werror -Icore \
            core/RRSelection.c tests/RRSelectionTests.c \
            -o "$RUNNER_TEMP/rr-selection-tests"
          "$RUNNER_TEMP/rr-selection-tests"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Verify package
        run: |
          file packages/*.deb
          ar -t packages/*.deb
          find .theos -name RadromRingProbe.dylib -exec file {} \;
          dpkg-deb --contents packages/*.deb | grep -E 'RadromRingPrefs.bundle|PreferenceLoader/Preferences/RadromRingPrefs.plist'
          shasum -a 256 packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RadromRing-config-probe-roothide
          path: packages/*.deb
          if-no-files-found: error
