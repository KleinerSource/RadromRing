name: Build RootHide tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - .github/workflows/build.yml
      - CHANGELOG.md
      - Makefile
      - control
      - core/**
      - Prefs/**
      - layout/**
      - RandomRingProbe.plist
      - Probe.m
      - tests/**
      - tools/**
      - repo/**

permissions:
  contents: read

# One Pages deployment at a time; the latest published branch wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      THEOS: /tmp/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up RootHide Theos
        run: |
          brew install ldid
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"

      - name: Check probe script syntax
        run: node --check tools/probe-call-ringtone.js

      - name: Test tone selection policy
        run: |
          clang -std=c11 -Wall -Wextra -Werror -Icore \
            core/RRSelection.c tests/RRSelectionTests.c \
            -o "$RUNNER_TEMP/rr-selection-tests"
          "$RUNNER_TEMP/rr-selection-tests"

      - name: Build package
        run: |
          python3 tools/make_icon.py
          make clean package FINALPACKAGE=1

      - name: Verify package
        run: |
          file packages/*.deb
          ar -t packages/*.deb
          find .theos -name RandomRingProbe.dylib -exec file {} \;
          python3 - <<'PY'
          import glob
          import io
          import lzma
          import subprocess
          import tarfile

          packages = glob.glob("packages/*.deb")
          if len(packages) != 1:
              raise SystemExit(f"Expected one package, found {len(packages)}")
          payload = subprocess.check_output(["ar", "p", packages[0], "data.tar.lzma"])
          data = lzma.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:") as archive:
              paths = [member.name.lstrip("./") for member in archive.getmembers()]
          expected = (
              "Library/PreferenceBundles/RandomRingPrefs.bundle/RandomRingPrefs",
              "Library/PreferenceBundles/RandomRingPrefs.bundle/Info.plist",
              "Library/PreferenceBundles/RandomRingPrefs.bundle/icon@3x.png",
              "Library/PreferenceLoader/Preferences/RandomRingPrefs.plist",
          )
          missing = [suffix for suffix in expected if not any(path.endswith(suffix) for path in paths)]
          if missing:
              raise SystemExit(f"Package is missing: {', '.join(missing)}")
          print("Preference bundle and Settings entry are present in the package")
          PY
          shasum -a 256 packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RandomRing-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Build APT repository
        run: |
          python3 tools/build_repo.py packages "$RUNNER_TEMP/repo"
          cp repo/index.html "$RUNNER_TEMP/repo/"
          touch "$RUNNER_TEMP/repo/.nojekyll"
          cat "$RUNNER_TEMP/repo/Packages"

      - name: Upload repository for Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/repo

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: RandomRing-roothide
          path: release-assets

      - name: Prepare release notes
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RandomRing ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release-assets/*.deb
          fail_on_unmatched_files: true
