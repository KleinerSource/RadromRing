name: Build RootHide tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - Makefile
      - control
      - core/**
      - Prefs/**
      - layout/**
      - RadromRingProbe.plist
      - Probe.m
      - tests/**
      - tools/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      THEOS: /tmp/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up RootHide Theos
        run: |
          brew install ldid
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$THEOS"

      - name: Check probe script syntax
        run: node --check tools/probe-call-ringtone.js

      - name: Test tone selection policy
        run: |
          clang -std=c11 -Wall -Wextra -Werror -Icore \
            core/RRSelection.c tests/RRSelectionTests.c \
            -o "$RUNNER_TEMP/rr-selection-tests"
          "$RUNNER_TEMP/rr-selection-tests"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Verify package
        run: |
          file packages/*.deb
          ar -t packages/*.deb
          find .theos -name RadromRingProbe.dylib -exec file {} \;
          python3 - <<'PY'
          import glob
          import io
          import lzma
          import subprocess
          import tarfile

          packages = glob.glob("packages/*.deb")
          if len(packages) != 1:
              raise SystemExit(f"Expected one package, found {len(packages)}")
          payload = subprocess.check_output(["ar", "p", packages[0], "data.tar.lzma"])
          data = lzma.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:") as archive:
              paths = [member.name.lstrip("./") for member in archive.getmembers()]
          expected = (
              "Library/PreferenceBundles/RadromRingPrefs.bundle/RadromRingPrefs",
              "Library/PreferenceBundles/RadromRingPrefs.bundle/Info.plist",
              "Library/PreferenceLoader/Preferences/RadromRingPrefs.plist",
          )
          missing = [suffix for suffix in expected if not any(path.endswith(suffix) for path in paths)]
          if missing:
              raise SystemExit(f"Package is missing: {', '.join(missing)}")
          print("Preference bundle and Settings entry are present in the package")
          PY
          shasum -a 256 packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RadromRing-config-probe-roothide
          path: packages/*.deb
          if-no-files-found: error
